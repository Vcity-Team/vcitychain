version: '3.9'

services:
  # Main VcityChain node service
  vcitychain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vcitychain-node
    ports:
      - "8545:8545"  # JSON-RPC HTTP
      - "8546:8546"  # JSON-RPC WebSocket
      - "9632:9632"  # gRPC
      - "1478:1478"  # LibP2P
      - "5001:5001"  # Prometheus metrics
    volumes:
      - vcitychain-data:/data
      - ./config:/app/config:ro
    environment:
      - CGO_ENABLED=1
      - GOOS=linux
    command: ["server", "--help"]
    restart: unless-stopped
    networks:
      - vcitychain-network
    depends_on:
      - rootchain

  # Rootchain service (Ethereum-compatible)
  rootchain:
    image: ghcr.io/0xpolygon/go-ethereum-console:latest
    container_name: vcitychain-rootchain
    command: [
      "--dev",
      "--dev.period", "2",
      "--datadir", "/eth1data",
      "--ipcpath", "/eth1data/geth.ipc",
      "--http",
      "--http.addr", "0.0.0.0",
      "--http.vhosts", "*",
      "--http.api", "eth,net,web3,debug",
      "--ws",
      "--ws.addr", "0.0.0.0"
    ]
    ports:
      - '8545:8545'
    volumes:
      - eth1data:/eth1data
    networks:
      - vcitychain-network
    restart: unless-stopped

  # Initialization service
  init:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/vcitychain
    container_name: vcitychain-init
    command: ["init", "polybft"]
    depends_on:
      rootchain:
        condition: service_started
    volumes:
      - vcitychain-data:/data
    networks:
      - vcitychain-network

  # Validator node 1
  validator-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/vcitychain
    container_name: vcitychain-validator-1
    command: [
      "server",
      "--data-dir", "/data/data-1",
      "--chain", "/data/genesis.json",
      "--grpc-address", "0.0.0.0:9632",
      "--libp2p", "0.0.0.0:1478",
      "--jsonrpc", "0.0.0.0:8545",
      "--prometheus", "0.0.0.0:5001",
      "--seal"
    ]
    depends_on:
      init:
        condition: service_completed_successfully
      rootchain:
        condition: service_started
    ports:
      - '10000:9632'  # gRPC
      - '10002:8545'  # JSON-RPC
      - '10003:5001'  # Prometheus
    volumes:
      - vcitychain-data:/data
    networks:
      - vcitychain-network
    restart: on-failure

  # Validator node 2
  validator-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/vcitychain
    container_name: vcitychain-validator-2
    command: [
      "server",
      "--data-dir", "/data/data-2",
      "--chain", "/data/genesis.json",
      "--grpc-address", "0.0.0.0:9632",
      "--libp2p", "0.0.0.0:1478",
      "--jsonrpc", "0.0.0.0:8545",
      "--prometheus", "0.0.0.0:5001",
      "--seal"
    ]
    depends_on:
      init:
        condition: service_completed_successfully
      rootchain:
        condition: service_started
    ports:
      - '20000:9632'  # gRPC
      - '20002:8545'  # JSON-RPC
      - '20003:5001'  # Prometheus
    volumes:
      - vcitychain-data:/data
    networks:
      - vcitychain-network
    restart: on-failure

  # Monitoring service (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: vcitychain-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - vcitychain-network
    restart: unless-stopped

  # Grafana dashboard (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: vcitychain-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - vcitychain-network
    restart: unless-stopped

networks:
  vcitychain-network:
    driver: bridge
    name: vcitychain-network

volumes:
  vcitychain-data:
    driver: local
  eth1data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
