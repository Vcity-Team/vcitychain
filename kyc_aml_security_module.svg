  <!-- 底部说明 -->
  <text x="300" y="465" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">🆔 KYC身份验证 + 🚫 AML反洗钱 | 🔐 多签+BLS聚合签名 | 👁️‍🗨️ 实时审计监控 | 🛡️ 合规安全防护</text>
