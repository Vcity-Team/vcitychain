<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="currentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="mainnetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="expansionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="complianceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E63;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#C2185B;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E63;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="700" height="400" fill="white"/>
  
  <!-- 标题 -->
  <rect x="0" y="0" width="700" height="50" fill="url(#headerGrad)"/>
  <text x="350" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">区块链发展路线图</text>
  <text x="350" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">当前阶段 → 主网上线 → 多链拓展 → 合规落地 | 完整生态发展路径</text>
  
  <!-- 发展路径线 -->
  <line x1="50" y1="200" x2="650" y2="200" stroke="#ddd" stroke-width="8" stroke-linecap="round"/>
  <line x1="50" y1="200" x2="650" y2="200" stroke="url(#progressGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- 当前阶段 -->
  <circle cx="100" cy="200" r="40" fill="url(#currentGrad)" stroke="#FF9800" stroke-width="3"/>
  <text x="100" y="195" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🚀</text>
  <text x="100" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">当前</text>
  <text x="100" y="250" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold">测试网络</text>
  <text x="100" y="265" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">技术验证</text>
  <text x="100" y="280" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">功能测试</text>
  <text x="100" y="295" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">社区建设</text>
  
  <!-- 主网上线 -->
  <circle cx="250" cy="200" r="40" fill="url(#mainnetGrad)" stroke="#4CAF50" stroke-width="3"/>
  <text x="250" y="195" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🌐</text>
  <text x="250" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">主网</text>
  <text x="250" y="250" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold">主网上线</text>
  <text x="250" y="265" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">正式运营</text>
  <text x="250" y="280" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">用户接入</text>
  <text x="250" y="295" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">生态发展</text>
  
  <!-- 多链拓展 -->
  <circle cx="400" cy="200" r="40" fill="url(#expansionGrad)" stroke="#2196F3" stroke-width="3"/>
  <text x="400" y="195" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🔗</text>
  <text x="400" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">多链</text>
  <text x="400" y="250" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold">多链拓展</text>
  <text x="400" y="265" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">平行链部署</text>
  <text x="400" y="280" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">跨链互通</text>
  <text x="400" y="295" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">性能提升</text>
  
  <!-- 合规落地 -->
  <circle cx="550" cy="200" r="40" fill="url(#complianceGrad)" stroke="#E91E63" stroke-width="3"/>
  <text x="550" y="195" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🛡️</text>
  <text x="550" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">合规</text>
  <text x="550" y="250" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold">合规落地</text>
  <text x="550" y="265" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">KYC/AML</text>
  <text x="550" y="280" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">监管合规</text>
  <text x="550" y="295" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">商业应用</text>
  
  <!-- 连接箭头 -->
  <line x1="140" y1="200" x2="210" y2="200" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="290" y1="200" x2="360" y2="200" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="200" x2="510" y2="200" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- 阶段时间线 -->
  <rect x="50" y="320" width="600" height="60" rx="8" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="350" y="340" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold">📅 发展阶段时间线</text>
  
  <!-- 时间节点 -->
  <circle cx="100" cy="360" r="8" fill="#FF9800" stroke="#F57C00" stroke-width="2"/>
  <text x="100" y="375" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="8">Q1 2024</text>
  
  <circle cx="250" cy="360" r="8" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <text x="250" y="375" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="8">Q2 2024</text>
  
  <circle cx="400" cy="360" r="8" fill="#2196F3" stroke="#1976D2" stroke-width="2"/>
  <text x="400" y="375" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="8">Q3 2024</text>
  
  <circle cx="550" cy="360" r="8" fill="#E91E63" stroke="#C2185B" stroke-width="2"/>
  <text x="550" y="375" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="8">Q4 2024</text>
  
  <!-- 连接线 -->
  <line x1="108" y1="360" x2="242" y2="360" stroke="#ddd" stroke-width="2"/>
  <line x1="258" y1="360" x2="392" y2="360" stroke="#ddd" stroke-width="2"/>
  <line x1="408" y1="360" x2="542" y2="360" stroke="#ddd" stroke-width="2"/>
  
  <!-- 关键里程碑 -->
  <rect x="50" y="390" width="600" height="10" rx="5" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <rect x="50" y="390" width="150" height="10" rx="5" fill="url(#currentGrad)"/>
  <rect x="200" y="390" width="150" height="10" rx="5" fill="url(#mainnetGrad)"/>
  <rect x="350" y="390" width="150" height="10" rx="5" fill="url(#expansionGrad)"/>
  <rect x="500" y="390" width="150" height="10" rx="5" fill="url(#complianceGrad)"/>
  
  <!-- 底部说明 -->
  <text x="350" y="415" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">🚀 当前测试网络 → 🌐 主网上线运营 → 🔗 多链拓展部署 → 🛡️ 合规落地应用 | 完整区块链生态发展路径</text>
</svg> 