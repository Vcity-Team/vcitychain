<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mainChainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="parallelChainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="500" height="400" fill="white"/>
  
  <!-- 标题 -->
  <rect x="0" y="0" width="500" height="50" fill="url(#headerGrad)"/>
  <text x="250" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">多链架构 + 多桥连接系统</text>
  <text x="250" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">合规安全模块（KYC/AML）内建 | 高性能、高拓展性（单链TPS≥10000，多链线性扩展→理论无限TPS）</text>
  
  <!-- 中央主链（高亮） -->
  <circle cx="250" cy="180" r="50" fill="url(#mainChainGrad)" stroke="#FF8C00" stroke-width="3"/>
  <text x="250" y="175" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">🏗️</text>
  <text x="250" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">中央主链</text>
  <text x="250" y="205" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">核心共识</text>
  
  <!-- 平行链1 - 资产链 -->
  <circle cx="120" cy="120" r="35" fill="url(#parallelChainGrad)" stroke="#4CAF50" stroke-width="2"/>
  <text x="120" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">💰</text>
  <text x="120" y="130" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">资产链</text>
  <text x="120" y="142" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">Token管理</text>
  
  <!-- 平行链2 - 隐私链 -->
  <circle cx="380" cy="120" r="35" fill="url(#parallelChainGrad)" stroke="#4CAF50" stroke-width="2"/>
  <text x="380" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🔒</text>
  <text x="380" y="130" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">隐私链</text>
  <text x="380" y="142" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">零知识证明</text>
  
  <!-- 平行链3 - DeFi链 -->
  <circle cx="120" cy="240" r="35" fill="url(#parallelChainGrad)" stroke="#4CAF50" stroke-width="2"/>
  <text x="120" y="235" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🏦</text>
  <text x="120" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">DeFi链</text>
  <text x="120" y="262" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">金融应用</text>
  
  <!-- 平行链4 - 游戏链 -->
  <circle cx="380" cy="240" r="35" fill="url(#parallelChainGrad)" stroke="#4CAF50" stroke-width="2"/>
  <text x="380" y="235" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🎮</text>
  <text x="380" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">游戏链</text>
  <text x="380" y="262" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">NFT/游戏</text>
  
  <!-- 平行链5 - 数据链 -->
  <circle cx="80" cy="180" r="35" fill="url(#parallelChainGrad)" stroke="#4CAF50" stroke-width="2"/>
  <text x="80" y="175" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">📊</text>
  <text x="80" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">数据链</text>
  <text x="80" y="202" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">数据存储</text>
  
  <!-- 平行链6 - 物联网链 -->
  <circle cx="420" cy="180" r="35" fill="url(#parallelChainGrad)" stroke="#4CAF50" stroke-width="2"/>
  <text x="420" y="175" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🌐</text>
  <text x="420" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">IoT链</text>
  <text x="420" y="202" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">物联网</text>
  
  <!-- 连接线 -->
  <!-- 主链到各平行链的连接 -->
  <line x1="200" y1="180" x2="155" y2="120" stroke="#FF8C00" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="300" y1="180" x2="345" y2="120" stroke="#FF8C00" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="200" y1="180" x2="155" y2="240" stroke="#FF8C00" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="300" y1="180" x2="345" y2="240" stroke="#FF8C00" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="200" y1="180" x2="115" y2="180" stroke="#FF8C00" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="300" y1="180" x2="385" y2="180" stroke="#FF8C00" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- 性能指标 -->
  <rect x="20" y="300" width="460" height="80" rx="6" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="315" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold">📈 核心性能指标</text>
  
  <rect x="30" y="325" width="90" height="30" rx="4" fill="url(#headerGrad)"/>
  <text x="75" y="335" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">≥10000</text>
  <text x="75" y="348" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">单链TPS</text>
  
  <rect x="140" y="325" width="90" height="30" rx="4" fill="url(#headerGrad)"/>
  <text x="185" y="335" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">∞</text>
  <text x="185" y="348" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">多链TPS</text>
  
  <rect x="250" y="325" width="90" height="30" rx="4" fill="url(#headerGrad)"/>
  <text x="295" y="335" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">线性扩展</text>
  <text x="295" y="348" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">理论无限</text>
  
  <rect x="360" y="325" width="90" height="30" rx="4" fill="url(#headerGrad)"/>
  <text x="405" y="335" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">&lt;2s</text>
  <text x="405" y="348" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">确认时间</text>
  
  <!-- 底部说明 -->
  <text x="250" y="395" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">🌐 多链架构/连接 | 🛡️ 合规安全模块（KYC/AML）内建 | ⚡ 高性能、高拓展性（单链TPS≥10000，多链线性扩展→理论无限TPS）</text>
</svg> 